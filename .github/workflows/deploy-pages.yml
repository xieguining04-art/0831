name: Deploy TengYoda website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Only merge the two release batches. Do not publish the old website folder.
      - name: Merge and verify website
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          batches = (Path("github-upload-1/website"), Path("github-upload-2/website"))
          output = Path(tempfile.mkdtemp(prefix="tengyoda-pages-", dir=os.environ["RUNNER_TEMP"]))
          for batch in batches:
              if not batch.is_dir() or batch.is_symlink():
                  raise SystemExit(f"Missing or invalid batch directory: {batch}")
              for source in sorted(batch.rglob("*")):
                  if source.is_symlink():
                      raise SystemExit(f"Symbolic links are not supported: {source}")
                  if not source.is_file():
                      continue
                  target = output / source.relative_to(batch)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() and target.read_bytes() != source.read_bytes():
                      raise SystemExit(f"Conflicting files in the two batches: {target.relative_to(output)}")
                  shutil.copyfile(source, target)

          required = [
              "index.html", "blog/index.html", "blog.html", "services/index.html",
              "china-australia.html", "china-australia-shipping-cost.html",
              "china-australia-shipping-time.html", "fcl-vs-lcl-china-australia.html",
              "ddp-shipping-china-australia.html", "sitemap.xml", "robots.txt", "favicon.svg",
              "blog/40hq-container-shipping-cost-china-australia/index.html",
              "blog/shipping-from-china-to-australia-guide/index.html",
              "blog/first-time-importing-from-china-guide/index.html",
              "blog/importing-from-china-to-australia-mistakes/index.html",
              "assets/images/blog/40hq-china-australia-cover.webp",
          ]
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              raise SystemExit("Missing files; preserve the folder structure: " + ", ".join(missing))

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.references = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if value and key in ("href", "src", "poster"):
                          self.references.append(value)
                      elif value and key == "srcset":
                          self.references.extend(item.strip().split()[0] for item in value.split(",") if item.strip())

          errors = []
          pages = sorted(output.rglob("*.html"))
          for page in pages:
              relative = page.relative_to(output)
              if str(relative) not in ("404.html", "blog.html"):
                  if relative.name == "index.html":
                      data_name = "index.rsc" if relative.parent == Path(".") else f"{relative.parent}.rsc"
                  else:
                      data_name = f"{relative}.rsc"
                  if not (output / data_name).is_file():
                      errors.append(f"Missing page data: {data_name}")
              parser = Links()
              parser.feed(page.read_text(encoding="utf-8"))
              for reference in parser.references:
                  url = urlsplit(reference)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  path = unquote(url.path)
                  target = (output / path.lstrip("/") if path.startswith("/") else page.parent / path).resolve()
                  if not target.is_relative_to(output) or not (target.is_file() or (target / "index.html").is_file()):
                      errors.append(f"{page.relative_to(output)} -> {reference}")
          if errors:
              raise SystemExit("Broken local links or assets:\n" + "\n".join(errors[:30]))

          total = sum(path.is_file() for path in output.rglob("*"))
          print(f"Verified {total} files and {len(pages)} HTML pages. Old misplaced files are excluded.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"path={output}\n")
          PY

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload merged website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.merge.outputs.path }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
