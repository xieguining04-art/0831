name: Deploy TengYoda website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # This release is for /0831/ only. Keep the official-domain release separate.
      # Upload tengyoda-github-preview.zip to the repository root WITHOUT unpacking.
      - name: Verify and unpack project preview
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("tengyoda-github-preview.zip")
          if not archive.is_file():
              raise SystemExit("Upload tengyoda-github-preview.zip to the repository root first. Do not unpack it.")
          output = Path(tempfile.mkdtemp(prefix="tengyoda-preview-", dir=os.environ["RUNNER_TEMP"]))
          with zipfile.ZipFile(archive) as zipped:
              entries = zipped.infolist()
              if sum(entry.file_size for entry in entries) > 50 * 1024 * 1024:
                  raise SystemExit("Unexpected archive size.")
              if len(entries) > 300:
                  raise SystemExit("Unexpected archive structure.")
              names = set()
              for entry in entries:
                  relative = PurePosixPath(entry.filename)
                  if relative.is_absolute() or ".." in relative.parts or "\\" in entry.filename:
                      raise SystemExit("Unsafe archive path.")
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit("Symbolic links are not permitted.")
                  if entry.filename in names:
                      raise SystemExit("Duplicate archive paths are not permitted.")
                  names.add(entry.filename)
              if "preview-release.json" not in names:
                  raise SystemExit("Wrong ZIP: the project-preview release manifest is missing.")
              manifest = json.loads(zipped.read("preview-release.json"))
              if manifest.get("basePath") != "/0831" or manifest.get("contentPages") != 24:
                  raise SystemExit("This archive is not the expected /0831/ preview.")
              expected = manifest.get("files", {})
              actual = {entry.filename for entry in entries if not entry.is_dir()}
              if actual != set(expected) | {"preview-release.json"}:
                  raise SystemExit("Files are missing from the archive or the release was changed.")
              for name, digest in expected.items():
                  body = zipped.read(name)
                  if hashlib.sha256(body).hexdigest() != digest:
                      raise SystemExit("File integrity check failed: " + name)
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(body)
              for required in ("index.html", "blog/index.html", "china-australia.html",
                               "services/sea-freight/index.html", "index.rsc"):
                  if not (output / required).is_file():
                      raise SystemExit("Missing required page: " + required)
              html = (output / "index.html").read_text(encoding="utf-8")
              if "/0831/assets/" not in html or "/0831/images/" not in html:
                  raise SystemExit("Homepage is missing the project-preview resource prefix.")
              print(f"Verified {len(expected)} files for /0831/. Old folders are not published.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"path={output}\n")
          PY

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload project preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.unpack.outputs.path }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
